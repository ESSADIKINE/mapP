      </ul>

        <h3 id="detailTitle"></h3>
        <div class="coords">
          <span id="detailCoords"></span>
          <button id="copyCoordsBtn">Copy</button>
        </div>
        <div id="detailMedia" class="pano-small is-empty">Media preview unavailable</div>
        <div id="detailMeta" class="info-meta">
          <span id="detailDistance"></span>
          <span id="detailTime"></span>

        <div id="detailPlaceType" class="detail-badge hidden"></div>
        <div id="detailDescription" class="detail-description hidden"></div>
        <div class="detail-contact-group">
          <div id="detailAddress" class="detail-contact hidden"></div>
          <div id="detailPhone" class="detail-contact hidden"></div>
        </div>
        <div id="detailLinks" class="detail-links"></div>
        <label class="route-toggle"><input type="checkbox" id="routeToggle"> Show route</label>
      </div>
    </aside>
  </div>

  <!-- Virtual Tour Modal -->
  <div id="tourModal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title" id="tourModalTitle">Virtual Tour</h3>
        <button class="modal-close" onclick="closeTourModal()">✕</button>
      </div>
      <div class="modal-body">
        <iframe id="tourIframe" src="" frameborder="0" allowfullscreen></iframe>
      </div>
    </div>
  </div>

  <!-- 360° Panorama Modal -->
  <div id="panoModal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title" id="panoModalTitle">360° View</h3>
        <button class="modal-close" onclick="closePanoModal()">✕</button>
      </div>
      <div class="modal-body">
        <div id="panoContainer" class="pannellum-container"></div>
      </div>
    </div>
  </div>
